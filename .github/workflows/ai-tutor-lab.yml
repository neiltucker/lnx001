name: LNX-001 AI Tutor Lab

on:
  push:
    branches:
      - 'ai-tutor-lab/**'
    paths:
      - 'ai-tutor-lab/build_experiment.py'
      - 'ai-tutor-lab/runtime-test.cjs'
      - 'ai-tutor-lab/local-model-test.cjs'
      - 'ai-tutor-lab/local-model-rag.js'
      - 'ai-tutor-lab/smollm2-prepare.py'
      - 'ai-tutor-lab/smollm2-test.cjs'
      - 'ai-tutor-lab/smollm2-360m-prepare.py'
      - 'ai-tutor-lab/smollm2-360m-test.cjs'
      - '.github/workflows/ai-tutor-lab.yml'
      - 'LNX-001_EN_SCORM2004.zip'
      - 'LNX-001_EN_TrainerPreparationGuide.txt'
      - 'Day-01-QuickReference.html'

permissions:
  contents: read

jobs:
  full-course-knowledge-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache pinned Gab model assets
        uses: actions/cache@v4
        with:
          path: ai-tutor-lab/model-cache
          key: gab-100m-q8-339be056d94f5615e7764f2ce3c8e67667dcabbb
      - name: Cache SmolLM2 model and pure-JavaScript runtime
        uses: actions/cache@v4
        with:
          path: ai-tutor-lab/smollm2-cache
          key: smollm2-135m-q4km-llama3pure-03d2b7d-v1
      - name: Cache SmolLM2-360M model and pure-JavaScript runtime
        uses: actions/cache@v4
        with:
          path: ai-tutor-lab/smollm2-360m-cache
          key: smollm2-360m-q4km-llama3pure-03d2b7d-v1
      - name: Build separate full-course knowledge candidate
        run: python ai-tutor-lab/build_experiment.py
      - name: Run baseline versus candidate retrieval tests
        run: node ai-tutor-lab/runtime-test.cjs
      - name: Test Gab 100M Q8 pure-JS baseline
        run: node ai-tutor-lab/local-model-test.cjs
      - name: Prepare SmolLM2-135M-Instruct candidate package
        run: python ai-tutor-lab/smollm2-prepare.py
      - name: Test SmolLM2-135M-Instruct with pure-JavaScript inference
        run: node ai-tutor-lab/smollm2-test.cjs
      - name: Prepare SmolLM2-360M-Instruct candidate package
        run: python ai-tutor-lab/smollm2-360m-prepare.py
      - name: Test SmolLM2-360M-Instruct with pure-JavaScript inference
        run: node ai-tutor-lab/smollm2-360m-test.cjs
      - name: Upload original, candidate packages, and reports
        uses: actions/upload-artifact@v4
        with:
          name: lnx001-ai-tutor-smollm2-135m-360m-pure-js-v1
          path: |
            LNX-001_EN_SCORM2004.zip
            LNX-001_EN_SCORM2004_AI-TUTOR-LAB-V8-SMOLLM2.zip
            LNX-001_EN_SCORM2004_AI-TUTOR-LAB-V9-SMOLLM2-360M.zip
            ai-tutor-lab/experiment-summary.json
            ai-tutor-lab/runtime-comparison.json
            ai-tutor-lab/EXPERIMENT_REPORT.md
            ai-tutor-lab/local-model-results.json
            ai-tutor-lab/smollm2-manifest.json
            ai-tutor-lab/smollm2-results.json
            ai-tutor-lab/smollm2-360m-manifest.json
            ai-tutor-lab/smollm2-360m-results.json
          if-no-files-found: error
